<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="八字四柱 × 紫微斗數合參的免費線上排盤。輸入生日時辰，即時看命盤與個性、事業、財運、感情解讀。">
<meta name="theme-color" content="#F5F7FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1322" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="算命PASS">
<meta property="og:description" content="八字 × 紫微斗數，兩套命盤合參解讀。">
<meta property="og:type" content="website">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>算命PASS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
/* Layout: 青花瓷 — porcelain ground, cobalt ink, one vermilion seal. Single column, form on top, three tabs of readings. */
:root {
  --paper: #F5F7FB;
  --panel: #FFFFFF;
  --ink: #15203B;
  --muted: #5A6582;
  --line: #CCD4E6;
  --cobalt: #2343A6;
  --cobalt-soft: #E3E9F8;
  --seal: #B5372B;
  --good: #2C7A4B;
  --warn: #A86A12;
  --wood: #2F7D4F;
  --fire: #C2412D;
  --earth: #9C6E22;
  --metal: #6F7A8F;
  --water: #245A9C;
  --hi: #FFF4D6;
  --f-display: "LXGW WenKai TC", "Kaiti TC", "STKaiti", "BiauKai", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-glyph: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0D1322; --panel: #141B2E; --ink: #E5E9F4; --muted: #95A1BF; --line: #2A3555;
  --cobalt: #8FA7F4; --cobalt-soft: #1D2747; --seal: #E2725F; --good: #6CC08E; --warn: #E0A84A;
  --wood: #6CC08E; --fire: #EE7E68; --earth: #D7A955; --metal: #AEB7C9; --water: #7DADE8; --hi: #2B2A1E;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0D1322; --panel: #141B2E; --ink: #E5E9F4; --muted: #95A1BF; --line: #2A3555;
  --cobalt: #8FA7F4; --cobalt-soft: #1D2747; --seal: #E2725F; --good: #6CC08E; --warn: #E0A84A;
  --wood: #6CC08E; --fire: #EE7E68; --earth: #D7A955; --metal: #AEB7C9; --water: #7DADE8; --hi: #2B2A1E;
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.75; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; font-weight: 700; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; }

/* masthead */
.mast { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; }
.seal { flex: none; width: 64px; height: 64px; border: 3px solid var(--seal); color: var(--seal); border-radius: 6px; display: grid; grid-template-columns: 1fr 1fr; place-items: center; font-family: var(--f-glyph); font-weight: 900; font-size: 22px; line-height: 1; padding: 4px; transform: rotate(-4deg); }
.mast h1 { font-size: clamp(30px, 6vw, 44px); letter-spacing: .04em; }
.mast h1 b { color: var(--cobalt); font-family: var(--f-body); font-weight: 700; letter-spacing: .08em; font-size: .62em; margin-left: .2em; vertical-align: .2em; }
.mast p { color: var(--muted); }

/* form */
.form { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: end; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span, .label { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
.field input[type=text], .field input[type=date], .field input[type=time], .field input[type=number], .field select {
  height: 40px; border: 1px solid var(--line); border-radius: 6px; padding: 0 10px; background: var(--paper); min-width: 0; }
#nameIn { width: 11em; }
.src { display: inline-block; font-size: 11px; line-height: 1; padding: 3px 6px; border-radius: 4px; margin-right: 6px; vertical-align: 2px; font-weight: 500; }
.src.gu { background: #F3E3D3; color: #8A3B12; }
.src.zw { background: #E6E1F5; color: #4B3A8C; }
.src.ck { background: #E8EBF0; color: #5A6372; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .src.gu { background: #3A2618; color: #F0C9A6; } :root:not([data-theme="light"]) .src.zw { background: #2A2440; color: #C9BEF0; } :root:not([data-theme="light"]) .src.ck { background: #262B33; color: #AEB6C2; } }
:root[data-theme="dark"] .src.gu { background: #3A2618; color: #F0C9A6; } :root[data-theme="dark"] .src.zw { background: #2A2440; color: #C9BEF0; } :root[data-theme="dark"] .src.ck { background: #262B33; color: #AEB6C2; }
.timepick { display: flex; align-items: center; gap: 6px; }
.timepick select { width: 5.2em; }
.timepick span { font-size: 14px; color: var(--muted); }
#lyIn { width: 6.5em; } #lmIn, #ldIn { width: 4.5em; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; height: 40px; }
.seg label { display: grid; place-items: center; padding: 0 14px; cursor: pointer; border-right: 1px solid var(--line); }
.seg label:last-child { border-right: 0; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--cobalt); color: var(--paper); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--cobalt); outline-offset: -3px; }
.check { display: flex; gap: 6px; align-items: center; height: 40px; }
.go { height: 42px; padding: 0 26px; border: 0; border-radius: 6px; background: var(--seal); color: #fff; font-family: var(--f-display); font-size: 18px; letter-spacing: .3em; cursor: pointer; }
.go:hover { filter: brightness(1.08); }
.hint { font-size: 13px; color: var(--muted); }
.err { color: var(--seal); font-size: 14px; }
.shichen { font-size: 13px; color: var(--cobalt); height: 40px; display: flex; align-items: center; }

/* result header + tabs */
.who { margin: 28px 0 10px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
.who h2 { font-size: 26px; }
.who .meta { color: var(--muted); font-size: 14px; }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--cobalt-soft); color: var(--cobalt); letter-spacing: .05em; }
.tag.sample { background: var(--hi); color: var(--warn); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--paper); z-index: 5; }
.tabs button { border: 0; background: none; padding: 10px 16px; font-family: var(--f-display); font-size: 18px; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected=true] { color: var(--ink); border-color: var(--seal); }

section.sec { display: grid; gap: 22px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
.card h3 { font-size: 20px; margin-bottom: 8px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.card h3 small { font-family: var(--f-body); font-size: 12px; color: var(--muted); font-weight: 400; letter-spacing: .05em; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 22px; }
.prose { display: grid; gap: 10px; max-width: 68ch; }
.prose b { color: var(--cobalt); font-weight: 700; }

/* key facts row */
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.fact { background: var(--panel); padding: 12px 14px; display: grid; gap: 2px; align-content: start; }
.fact .v { font-family: var(--f-display); font-size: 22px; line-height: 1.3; }
.fact .s { font-size: 12px; color: var(--muted); }

/* elements */
.el-木 { color: var(--wood); } .el-火 { color: var(--fire); } .el-土 { color: var(--earth); } .el-金 { color: var(--metal); } .el-水 { color: var(--water); }
.bg-木 { background: var(--wood); } .bg-火 { background: var(--fire); } .bg-土 { background: var(--earth); } .bg-金 { background: var(--metal); } .bg-水 { background: var(--water); }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 2em 1fr 3.4em; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; }
.bar .k { font-family: var(--f-glyph); font-weight: 900; font-size: 18px; text-align: center; }
.bar .track { height: 12px; background: var(--cobalt-soft); border-radius: 99px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 99px; }
.bar .n { text-align: right; font-size: 13px; color: var(--muted); }

/* pillars */
.scroll { overflow-x: auto; }
table.pillars { border-collapse: collapse; width: 100%; min-width: 440px; text-align: center; font-variant-numeric: tabular-nums; }
.pillars th { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .1em; padding: 6px; }
.pillars td { border-top: 1px solid var(--line); padding: 6px; }
.pillars th:first-child, .pillars td:first-child { text-align: left; color: var(--muted); font-size: 12px; width: 4.5em; }
.glyph { font-family: var(--f-glyph); font-weight: 900; font-size: 40px; line-height: 1.15; }
.pillars .dm { background: var(--cobalt-soft); }
.small { font-size: 13px; }
.mutedtxt { color: var(--muted); }

/* timeline */
.yun { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(88px, 1fr); gap: 8px; overflow-x: auto; padding-bottom: 6px; }
.yun .step { border: 1px solid var(--line); border-radius: 8px; padding: 8px; text-align: center; display: grid; gap: 2px; background: var(--paper); }
.yun .step.now { border-color: var(--seal); box-shadow: inset 0 0 0 1px var(--seal); background: var(--hi); }
.yun .gz { font-family: var(--f-glyph); font-weight: 900; font-size: 24px; line-height: 1.2; }
.yun .age { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-size: 12px; padding: 0 8px; border-radius: 99px; border: 1px solid currentColor; line-height: 1.6; }
.pill.up { color: var(--good); } .pill.flat { color: var(--muted); } .pill.down { color: var(--seal); }

/* ziwei board */
.board-wrap { overflow-x: auto; }
.zw-split { display: grid; gap: 22px; }
@media (min-width: 980px) { .zw-split { grid-template-columns: minmax(0, 1.75fr) minmax(280px, 1fr); align-items: start; } .zw-split #palaceDetail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 56px); max-height: calc(100vh - 72px); overflow-y: auto; } .zw-split .board { min-width: 0; grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.board { display: grid; grid-template-columns: repeat(4, minmax(140px, 1fr)); grid-template-rows: repeat(4, minmax(150px, auto)); gap: 0; border: 2px solid var(--ink); min-width: 580px; background: var(--panel); }
.pal { border: 1px solid var(--line); padding: 6px 7px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; text-align: left; background: var(--panel); position: relative; min-width: 0; }
.pal:hover { background: var(--cobalt-soft); }
.pal.sel { background: var(--cobalt-soft); box-shadow: inset 0 0 0 2px var(--cobalt); }
.pal.tri { background: color-mix(in srgb, var(--cobalt-soft) 55%, var(--panel)); }
.pal .majors { display: flex; flex-wrap: wrap; gap: 0 6px; }
.star-major { font-family: var(--f-display); font-size: 17px; font-weight: 700; color: var(--seal); white-space: nowrap; }
.star-major .br { font-family: var(--f-body); font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 1px; }
.mut { display: inline-block; font-family: var(--f-body); font-size: 11px; font-weight: 700; color: #fff; border-radius: 3px; padding: 0 3px; margin-left: 2px; line-height: 1.5; vertical-align: 2px; }
.mut-祿 { background: var(--good); } .mut-權 { background: var(--cobalt); } .mut-科 { background: var(--warn); } .mut-忌 { background: var(--seal); }
.minors { font-size: 13px; color: var(--ink); display: flex; flex-wrap: wrap; gap: 0 6px; }
.minors .bad { color: var(--muted); }
.empty { font-size: 11px; color: var(--muted); }
.adj { font-size: 11px; color: var(--muted); line-height: 1.4; }
.pal .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: end; gap: 4px; padding-top: 4px; }
.pal .pname { font-family: var(--f-display); font-size: 16px; font-weight: 700; color: var(--cobalt); }
.pal .gz { font-family: var(--f-glyph); font-size: 13px; color: var(--muted); }
.pal .rng { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pal .marks { position: absolute; top: 4px; right: 5px; display: flex; gap: 3px; }
.mk { font-size: 11px; padding: 0 4px; border-radius: 3px; border: 1px solid; line-height: 1.5; }
.mk.body { color: var(--warn); border-color: var(--warn); }
.mk.dec { color: var(--cobalt); border-color: var(--cobalt); }
.mk.yr { color: var(--seal); border-color: var(--seal); }
.center { grid-column: 2 / 4; grid-row: 2 / 4; border: 1px solid var(--line); padding: 14px; display: grid; gap: 6px; align-content: center; text-align: center; background: var(--paper); }
.center .t { font-family: var(--f-display); font-size: 22px; }
.center dl { display: grid; grid-template-columns: auto auto; gap: 2px 10px; justify-content: center; margin: 0; font-size: 13px; text-align: left; }
.center dt { color: var(--muted); } .center dd { margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 10px; align-items: center; }

.list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.list li { padding-left: 14px; position: relative; }
.list li::before { content: ""; position: absolute; left: 0; top: .75em; width: 6px; height: 6px; border-radius: 50%; background: var(--cobalt); }
.foot-note { margin-top: 36px; font-size: 13px; color: var(--muted); max-width: 72ch; }
.foot-links { margin-top: 12px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 16px; }
.foot-links a { color: var(--cobalt); }

@media (max-width: 640px) {
  body { font-size: 14.5px; }
  .wrap { padding-block: 18px 48px; }
  .card { padding: 14px 12px; }
  .form { padding: 14px 12px; }
  .row { gap: 12px; }
  .row > .field, .row > .row { flex: 1 1 auto; }
  #nameIn, #dateIn { width: 100%; }
  .timepick select { flex: 1 1 0; width: auto; }
  #solarBox, #solarBox .field { flex: 1 1 100%; }
  .go { flex: 1 1 100%; }
  .seg { display: flex; width: 100%; }
  .seg label { flex: 1; }
  .pillars td:first-child { white-space: nowrap; }
  .who h2 { font-size: 22px; }
  .tabs { gap: 0; }
  .tabs button { flex: 1; padding: 10px 4px; font-size: 16px; }
  table.pillars { min-width: 0; }
  .pillars td, .pillars th { padding: 5px 2px; }
  .pillars th:first-child, .pillars td:first-child { width: 2.6em; font-size: 11px; }
  .pillars .small { font-size: 12px; }
  .glyph { font-size: 30px; }
  .yun { grid-auto-columns: 76px; }
  .yun .gz { font-size: 21px; }
  /* compact 12-palace board: whole chart fits the phone, details open below */
  .board-wrap { overflow: visible; }
  .board { min-width: 0; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(96px, auto)); border-width: 1.5px; }
  .pal { padding: 3px 3px 2px; gap: 1px; }
  .pal .majors { flex-direction: column; gap: 0; }
  .star-major { font-size: 13.5px; line-height: 1.35; }
  .star-major .br { font-size: 9.5px; }
  .mut { font-size: 9px; padding: 0 2px; margin-left: 1px; }
  .minors { font-size: 10.5px; line-height: 1.35; gap: 0 3px; }
  .adj { display: none; }
  .pal .foot { padding-top: 2px; }
  .pal .pname { font-size: 12.5px; }
  .pal .gz { font-size: 10px; text-align: right; }
  .pal .rng { font-size: 9.5px; }
  .pal .marks { top: 2px; right: 2px; gap: 1px; }
  .mk { font-size: 9px; padding: 0 2px; }
  .center { padding: 6px; gap: 2px; }
  .center .t { font-size: 15px; }
  .center dl { font-size: 11px; gap: 0 6px; }
  .center .opt { display: none; }
  .legend { font-size: 11px; gap: 4px 10px; }
  .tabs button { padding: 10px 10px; font-size: 16px; }
  .mast { gap: 12px; } .seal { width: 52px; height: 52px; font-size: 18px; }
}
@media (prefers-reduced-motion: no-preference) {
  .res-in { animation: rise .35s ease-out both; }
  @keyframes rise { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }
}
</style>

</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="seal" aria-hidden="true"><span>八</span><span>字</span><span>紫</span><span>微</span></div>
    <div>
      <h1>算命<b>PASS</b></h1>
      <p>八字四柱 × 紫微斗數，兩套命盤合參解讀。資料只在你的瀏覽器裡計算，不會上傳。</p>
    </div>
  </header>

  <form class="form" id="form" autocomplete="off">
    <div class="row">
      <label class="field"><span>姓名（選填）</span><input type="text" id="nameIn" maxlength="20" placeholder="例如：王小明"></label>
      <div class="field"><span class="label">性別</span>
        <div class="seg" role="radiogroup" aria-label="性別">
          <label><input type="radio" name="gender" id="gM" value="男" checked>男</label>
          <label><input type="radio" name="gender" id="gF" value="女">女</label>
        </div>
      </div>
      <div class="field"><span class="label">曆法</span>
        <div class="seg" role="radiogroup" aria-label="曆法">
          <label><input type="radio" name="cal" id="calS" value="solar" checked>國曆</label>
          <label><input type="radio" name="cal" id="calL" value="lunar">農曆</label>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="row" id="solarBox">
        <label class="field"><span>出生日期（國曆）</span><input type="date" id="dateIn" min="1900-01-01" max="2100-12-31" required></label>
      </div>
      <div class="row" id="lunarBox" hidden>
        <label class="field"><span>農曆年</span><input type="number" id="lyIn" min="1900" max="2100" inputmode="numeric"></label>
        <label class="field"><span>月</span><input type="number" id="lmIn" min="1" max="12" inputmode="numeric"></label>
        <label class="field"><span>日</span><input type="number" id="ldIn" min="1" max="30" inputmode="numeric"></label>
        <label class="check"><input type="checkbox" id="leapIn">閏月</label>
      </div>
      <div class="field"><span id="timeLbl">出生時間</span><div class="timepick" role="group" aria-labelledby="timeLbl"><select id="hourIn" aria-label="時"></select><span>時</span><select id="minIn" aria-label="分"></select><span>分</span></div><input type="hidden" id="timeIn"></div>
      <div class="shichen" id="shichen"></div>
      <button class="go" type="submit">排盤</button>
    </div>
    <p class="hint">時間請填當地鐘錶時間。出生時辰不確定時，可先用最接近的時辰，看看哪一個盤的描述比較貼近自己。</p>
    <p class="err" id="err" hidden></p>
  </form>

  <div id="result"></div>

  <p class="foot-note">排盤使用開源曆法函式庫 lunar-javascript 與紫微斗數函式庫 iztro 計算；八字以節氣換月、晚子時（23 點後）日柱仍算當日，未做真太陽時校正。格局依《子平真詮》月令取用，強弱以通根計算，並參考調候與從格；仍屬規則化推算，解讀文字依傳統命理通則整理，僅供參考與娛樂，重大決定請以實際情況與專業意見為準。</p>

function computeBazi(solar, gender) {

// 大運重地支，流年重天干（滴天髓〈歲運〉）；運支沖月令另扣分（子平真詮〈論行運〉）
function rateGZ(gz, fav, unfav, kind, mz) {
  const w = kind === 'yun' ? [0.8, 1.2] : [1.2, 0.8];
  let s = 0;
  [STEM_EL[gz[0]], BRANCH_EL[gz[1]]].forEach((e, i) => { if (fav.includes(e)) s += w[i]; if (unfav.includes(e)) s -= w[i]; });
  if (CHONG[gz[1]] === mz) s -= 0.8;
  return s >= 0.8 ? 'up' : s <= -1.2 ? 'down' : 'flat';

// 子平真詮〈論正官取運〉：「若官露而不可逢合，不可雜煞，不可重官」
function guanCheck(bz, gz) {

  const guan = [0, 1, 3].map((i) => bz.cols[i].gan).find((g) => tenGod(bz.dm, g) === '正官');
  if (!guan) return '';
  const god = tenGod(bz.dm, gz[0]);
  if (god === '正官') return `重官：命局正官${guan}已透，又逢${gz[0]}正官，《子平真詮．論正官取運》說官露「不可重官」，書中也說「正官運又遇官則重」`;
  if (god === '七殺') return `雜煞：命局正官${guan}已透，又逢${gz[0]}七殺，《子平真詮》說官露「不可雜煞」`;
  if (GANHE[gz[0]] === guan) return `逢合：${gz[0]}合住命局正官${guan}，《子平真詮》說官露「不可逢合」`;
  return '';
}
function rateFull(bz, gz, kind) { return guanCheck(bz, gz) ? 'down' : rateGZ(gz, bz.fav, bz.unfav, kind, bz.mz); }
function yearGZ(y) { return STEMS[((y - 4) % 10 + 10) % 10] + BRANCHES[((y - 4) % 12 + 12) % 12]; }

function computeZiwei(solar, tIdx, gender) {
  const ds = solar.getYear() + '-' + solar.getMonth() + '-' + solar.getDay();
  const a = iztro.astro.bySolar(ds, tIdx, gender, true, 'zh-TW');
  let h = null; try { h = a.horoscope(new Date()); } catch (e) { h = null; }
  return { a, h };
}

/* ---------- render ---------- */
let state = null; let selPalace = null; let tab = 'all';
try { tab = localStorage.getItem('fortune.tab') || 'all'; } catch (e) {}

function render(input, sample) {
  const solar = input.solar;
  const bz = computeBazi(solar, input.gender);
  bz.dayun.forEach((d) => { if (guanCheck(bz, d.gz)) d.rate = 'down'; });
  const zw = computeZiwei(solar, input.tIdx, input.gender);
  state = { input, bz, zw, sample };
  const ming = zw.a.palaces.find((p) => p.name === '命宮');
  selPalace = ming.index;
  const nm = input.name ? esc(input.name) : (sample ? '範例命盤' : '你的命盤');
  const lunarStr = t(bz.lunar.getYearInGanZhi() + '年 ' + bz.lunar.getMonthInChinese() + '月' + bz.lunar.getDayInChinese());
  $('#result').innerHTML = `
    <div class="who res-in">
      <h2>${nm}</h2>
      ${sample ? '<span class="tag sample">範例資料，填入你的生日後重新排盤</span>' : ''}
      <span class="meta">${input.gender}命 · 國曆 ${solar.getYear()}年${solar.getMonth()}月${solar.getDay()}日 ${input.time} · 農曆 ${lunarStr} ${SHICHEN[input.tIdx].replace(/^早|^晚/, '')}時 · 屬${t(bz.lunar.getYearShengXiao())}</span>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="all">綜合解讀</button>
      <button role="tab" data-tab="bazi">八字</button>
      <button role="tab" data-tab="ziwei">紫微斗數</button>
    </div>
    <section class="sec res-in" data-panel="all">${renderSummary()}</section>
    <section class="sec res-in" data-panel="bazi">${renderBazi()}</section>
    <section class="sec res-in" data-panel="ziwei">${renderZiwei()}</section>`;
  document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));
  bindBoard();
  setTab(tab);
}
function setTab(name) {
  tab = name; try { localStorage.setItem('fortune.tab', name); } catch (e) {}
  document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', b.dataset.tab === name));
  document.querySelectorAll('[data-panel]').forEach((p) => { p.hidden = p.dataset.panel !== name; });
}

const QS = {"兄弟":{"紫微":"紫微有倚靠年長之兄。天府同、三人。天相同、三四人。","天機":"天機廟旺、有二人。與巨門同、二人，陷地，相背不一心。天梁同、二人，太陰同、二三人，見羊陀火鈴、雖有而剋害。","太陽":"太陽廟旺、三人。與巨門同、無殺加，有三人。太陰同、五人，陷地、不和欠力。加羊陀、火鈴、空劫、更剋，減半。","武曲":"武曲廟旺、有二人，不合。陷宮、加殺、只一人。天相同、二人。破軍七殺同、有一人，不和睦。加昌曲左右、有三人。見羊陀、火鈴、空劫，孤單。","天同":"天同入廟、四五人。天梁同、二三人。巨門同、無殺，三人。太陰同、四五人，陷地、只二人。見羊陀、火鈴、空劫忌，少，宜分居不和。","廉貞":"廉貞入廟、二人。貪狼同、招怨。天相同、二人。七殺同、一人。天府同、加左右昌曲，有三人。見羊陀、火鈴、空劫、有剋，且不和。","天府":"天府、有五人。紫微同、加左右昌曲，有六七人。廉貞同、三人。見羊陀、火鈴、空劫，只二人。","太陰":"太陰入廟、兄弟五人。太陽同、亦五六人。天機同、二人。科權同、四五人。見羊陀、火鈴、空劫、減半，且剋，宜分居相背。","貪狼":"貪狼廟旺、二人。陷地、宜各胞。廉貞同、不和。紫微同、有三人。加羊陀、火鈴、空劫，孤單。","巨門":"巨門廟旺、二人；陷地、各胞有，宜分居。太陽同、加左右昌曲，有三人。天機同、有二人，更乖違、不一心。天同、二三人。加羊陀、火鈴、空劫，孤剋。","天相":"天相和平、有二三人。紫微同、有三四人。武曲同、二人。廉貞同、二人。見羊陀、火鈴、空劫，孤單。","天梁":"天梁廟旺、二人。和順，或多不同胞且不和。陷宮、全無。天同同、三人。天機同、二人。見羊陀、火鈴、空劫，少。","七殺":"七殺主孤剋，在子午寅申宮方有三人，也不和宜各人；加昌曲左右更好。","破軍":"破軍入廟、三人。陷地、加殺、孤單。武曲同、二人。紫微同、二人。廉貞同、一人。加昌曲、左右，有三人，和睦。加羊陀、火鈴、空劫，孤單。","文昌":"文昌文曲，諸宮、皆有三。見羊陀、火鈴、廟旺不剋，陷宮、孤單。加空劫全無。","文曲":"文昌文曲，諸宮、皆有三。見羊陀、火鈴、廟旺不剋，陷宮、孤單。加空劫全無。","左輔":"左輔，有三人。同天同昌曲、有四五人。加羊陀、火鈴，二人。有空劫、欠力不和。","右弼":"右弼，三人。同府相、紫微、昌曲，有四五人。加羊陀、火鈴，二人。有空劫、欠力不和睦。","祿存":"祿存，相生、有兄弟。見殺剋害、招怨。","擎羊":"羊鈴剋害、入廟、一人。眾吉星加、有二三人。陷地、全無。","火星":"火星入廟、逢有吉星，有一二人。加廉殺破鈴，孤剋。","鈴星":"鈴星入廟相生、有兄弟。加羊陀、火、空劫，全無。"},"夫妻":{"紫微":"晚聘諧老，性剛。天府同、諧老。天相同、年少。破軍同、剋刑。加羊陀、火鈴，亦刑。貪狼同、有吉星，免刑。","天機":"宜年少剛強之，妻可配夫宜長。加羊陀、火鈴，主生離，晚娶吉。天梁同、宜年長。太陰同、內助美容。","太陽":"廟旺，遲娶吉，早娶剋，因妻得貴。與天梁同、加左右，招賢明之妻。太陰同、內助。巨門同，無羊陀、火鈴、空劫，不剋。見羊陀、火鈴、空劫，遲娶免刑，晚娶得諧老。","武曲":"背剋，宜遲娶，同年夫婦也相當。加吉星、因妻得財。貪狼同、招遲，無刑。七殺同剋、二三妻。加羊陀、火鈴、空劫，更剋。","天同":"遲娶諧老，夫宜長妻宜少。加四殺、欠和生離。巨門同、加四殺，亦剋。太陰同、助美容。天梁同、極美夫婦。","廉貞":"三度作新郎。貪狼同、愈剋。七殺同、亦刑，且欠和。加羊陀、火鈴，主生離。天府諧老，性剛者、無剋。","天府":"（〈論妻妾訣〉無天府獨立條目；紫微同、諧老；廉貞同、諧老，性剛者無剋。）","太陰":"入廟，男女皆貴，美夫婦。加昌曲、極美。加羊陀、火鈴、空劫、耗忌，不剋主生離。太陽同、諧老。天同同、內助。天機同、美好，宜少年。","貪狼":"男女不得美，三次作新郎，入廟宜遲娶。廉貞同、主剋。加羊陀、火鈴，主生離。紫微同、年長方可對。","巨門":"宜年長，定剋欠和。太陽同、無四殺加，諧老。天機同、內助美貌。天同同、性聰之妻並頭。加羊陀、火鈴、空劫，定剋二妻、或主生離。","天相":"貌美賢淑，夫宜年長，親上成親。紫微同、諧老。武曲、少和。廉貞同、入廟，免刑。加羊陀、火鈴、空劫，刑剋。","天梁":"妻宜大美容。天同同、和氣。天機、招美淑。加羊陀、火鈴、空劫、不和順。","七殺":"早剋。武曲同、亦剋，或遲娶免刑。廉貞、主生離。加羊陀、火鈴、空劫，剋三妻。","破軍":"男女俱剋，別聚主生離。武曲同、剋三。廉貞、亦剋且欠和。紫微同、宜年長之妻。","文昌":"妻少、內助聰明。天機太陰同、主美容。不宜陷地。加羊陀、火鈴、空劫深忌。","文曲":"相生會太陰諸吉星，諧老。加羊陀、火鈴、空劫、忌星，有剋。","祿存":"相生無剋，妻宜年少，並頭遲娶者。加羊陀、火鈴、空劫、見截路空亡，孤單。","左輔":"諧老。加羊陀、火鈴、空劫、貪廉同，宜年長剛強之妻。","右弼":"諧老。加羊陀、火鈴、空劫、貪廉同，宜年長剛強之妻。","擎羊":"入廟加吉星，遲娶免刑、或久和。陷地早剋。加日月、巨機、火鈴、武殺，主生離。","陀羅":"入廟加吉星，遲娶免刑、或久和。陷地早剋。加日月、巨機、火鈴、武殺，主生離。","火星":"入廟加吉，無刑。陷地、刑剋。","鈴星":"入廟加吉，無刑。陷地、刑剋。","天魁":"多主夫婦美麗，坐妻宮必主得妻財，加吉星同主貴美夫婦。","天鉞":"多主夫婦美麗，坐妻宮必主得妻財，加吉星同主貴美夫婦。"},"子女":{"紫微":"紫微廟旺、男三女二。加左右昌曲、有五人。加羊陀、火鈴、空劫，只一雙。破軍同、三人。天府同、加吉星，四五人。加昌曲、左右，有貴子。","天機":"天機廟旺、二人。巨門、一人。天梁同，在寅宮、有二三人，在申宮、女多男少。太陰同、二三人。加羊陀、火鈴、空劫，全無子。","太陽":"太陽入廟，男三女二晚子貴。巨門同、三人。太陰同、五人。陷地、有三子。再加羊陀、火鈴、空劫，止留一子送終。","武曲":"武曲主一子。破軍同、主刑，止有一人。貪狼，晚招二子。天相同，先招外子，後親生一子。七殺同，主孤。","天同":"天同廟旺、五子有貴。巨門同、三人。太陰同、五人，在午宮陷地減半。天梁同、先女後男有二子。加羊陀、火鈴、空劫、見刑剋，子少送終。","廉貞":"廉貞、一人。天府同、主貴子三人。若貪狼、破軍、七殺同，主孤。天相同、有二子。","天府":"天府、五人。武曲同、二人。紫微同、四五人。廉貞同、三人。加羊陀、火鈴、空劫，止三人。","太陰":"太陰，女三男二，先女後男。廟旺、有貴子；陷地、減半。太陽同、五人。天機同、二人。天同同、五人。加羊陀、火鈴、空劫，子少。","貪狼":"貪狼廟旺、二人，早有刑剋。紫微同、二人。廉貞同、子少。武曲同、三人，先難後易。","巨門":"巨門入廟、二人，先難後易。太陽同居、一二子易養。加羊陀、火鈴，子少。天機同、一人。有吉星同、二人。","天相":"天相，無羊陀、火鈴同，有二子成器。紫微同、如昌曲、左右，有三四人。武曲同、有三人。見羊陀、火鈴、空劫，必剋。","天梁":"天梁廟旺、二人。天同同，加昌曲、左右吉星，有三人。天機同、有二人。加羊陀、火鈴、空劫，早剋。","七殺":"七殺主孤，一人之分。紫微同、再吉星，有三人。","破軍":"破軍入廟、三人，剛強之子。紫微同、三人。武曲同，加昌曲、左右，有三人。廉貞同，一人。","左輔":"左輔單居、男三女一。見紫微、天府諸吉星，主貴子。","右弼":"右弼、三人。加吉星、有貴子。見羊陀、火鈴、空劫，減半。","文昌":"文昌、三人。加吉星、更多。有擎陀、火鈴、空劫，只可一子之分。","文曲":"文曲廟旺、有四人。陷地、有二三人。加擎羊、羅陀、火鈴，子少。","祿存":"祿存主孤，宜庶出。加吉星、有一人。","擎羊":"羊陀陷宮、孤單。加吉星廟旺、有一人，如對宮有吉星多無殺沖，亦有三四人。","陀羅":"羊陀陷宮、孤單。加吉星廟旺、有一人，如對宮有吉星多無殺沖，亦有三四人。","火星":"火星逢吉同不孤，陷宮加殺刑傷。","鈴星":"鈴星獨守孤單，加吉星入廟，看對宮吉，多二三人。","天魁":"魁鉞單守，主有貴子。","天鉞":"魁鉞單守，主有貴子。"},"財帛":{"紫微":"豐足倉箱。","天機":"勞心費力生財。","太陽":"入廟、豐足，陷宮、勞碌不遂。","武曲":"豐足，化吉、有巨萬家資，無吉加、鬧中進財。","天同":"白手生財晚發。","廉貞":"在申寅宮、鬧中生財，陷宮、先難後易。","天府":"富足。","太陰":"入廟、富足倉箱，陷宮、成敗不聚。","貪狼":"廟旺、橫發，陷地、貧窮。","巨門":"白手生財成家，宜鬧中取，氣高之人橫破。","天相":"富足。","天梁":"富足，入廟、上等富貴，陷宮、辛勤求財度日。","破軍":"在子午宮、多有金銀寶貝蓄積，辰戌旺宮、亦財盛，陷宮、破不祖聚。","文昌":"富足倉箱，加吉星、財氣旺。","文曲":"入廟、富足。","左輔":"諸宮富足。","右弼":"諸宮富足。","祿存":"富足倉箱、堆金積玉。","擎羊":"辰戌丑未宮、鬧中生財。","陀羅":"鬧中生財。","火星":"獨守，橫發橫破。","鈴星":"入廟、獨守橫發；陷地、孤寒，辛苦度日。","天魁":"主清高中生財，一生遂意。","天鉞":"主清高中生財，一生遂意。"},"疾厄":{"紫微":"災少。天府同、亦少。天相同、皮胎勞。如加破軍、血氣不和。同羊鈴、主有暗疾。","天機":"繈褓多災。巨門同、血氣疾。天梁同、下部疾。太陰同、瘡災。加羊火，陷宮、有目疾，四肢無力。","太陽":"頭風。太陰同，加化忌、羊陀，主眼目有傷，陷宮、亦主目疾欠光明。","武曲":"繈褓災迍。羊陀同、一生常有災。天相同、招暗疾。七殺同、血疾。貪狼同、廟旺無疾。","天同":"入廟、災少。巨門同、心氣疾。太陰同、加羊火，血氣疾。天梁同、加四殺，心氣疾。","廉貞":"繈褓災瘡、腰足之疾。入廟加吉、和平。七殺、破軍、天府同，災少。","天府":"災少，臨災有救。紫微同、災少。","太陰":"廟旺、無災，陷地、災多、主勞傷之症。若太陽同、加吉，美，一生災少。羊陀、火鈴，眼目疾。","巨門":"少年膿血之厄。太陽同、有頭瘋疽。加忌、有耳目之憂。","天相":"災少，面皮黃腫、血氣之疾。紫微同、災少。","七殺":"幼年多災，長主痔疾。","破軍":"幼年瘡癩。紫微同、災少。","文昌":"獨守、災少。加羊陀、火鈴、空劫，災多。同諸吉星，一生無災。","文曲":"災少。加吉星、一世無災。","左輔":"獨守、平和。加吉星、災少。見羊陀、火鈴、空劫、常有災。","右弼":"獨守、逢災有救。見羊陀、火鈴、空劫，災多。","祿存":"少年多災。加吉星、災少。","擎羊":"有頭瘋之症，或四肢欠力，加吉星災少。","陀羅":"幼年災，磨唇齒頭面。"},"遷移":{"紫微":"同左右、出外貴人扶持發福。天府同、出入通達。天相同、在外發財。破軍同、貴人見愛，小人不足。加羊陀、火鈴、空劫，在外不安靜。","天機":"出外遇貴、居家有是非。巨門同、動中則吉。天梁同、出外稱意。太陰同、忙中吉。加羊陀、火鈴，在外多是非、身不安靜。","太陽":"宜出外發福，不耐靜守。太陰同、出外忙中吉。巨門、勞心。加羊陀、火鈴、空劫，在外心身不清閒。","武曲":"鬧忙中進財、不宜靜守。貪狼同、作鉅賈。七殺、破軍同，身心不得靜守。加羊陀、火鈴，在外招是非。","天同":"出外遇貴人扶持。巨門同，勞心。太陰同，辛苦。天梁同，貴人見愛。加羊陀、火鈴、空劫，在外少遂志。","廉貞":"出外通達近貴，在家日少。貪狼同、鬧中立腳。七殺同、在外廣招財。天相同、動中則吉。","天府":"出外遇貴人扶持。同紫微，發福。廉貞、武曲，鬧中取財、作鉅賈。","太陰":"入廟、出外遇貴發財，陷宮、招是非。太陽同、極美。天機同、欠寧靜。天同同、在廟旺地，出外白手生財成家。","貪狼":"獨守，在外勞碌，鬧中橫進財。廉貞同、加四殺，在外艱難。武曲同、作鉅賈。","巨門":"出外勞心不安，與人不足多是非。加羊陀、火鈴、空劫，愈甚。","天相":"出外貴人提攜。紫微同、吉利。武曲同、在外發財。廉貞同，加羊陀、火鈴，招是非小人、不足。","天梁":"出外近貴、貴人成就。天同同、福厚。天機同、藝術途中走。","七殺":"在外日多，在家日少。武曲同、動中則吉。廉貞同、在外生財。紫微同、在外多遂志。加羊陀、火鈴、空劫，又操心不寧。","破軍":"出外勞心不寧，入廟、在外崢嶸。加羊陀、火鈴，奔馳巧藝走途中。","文昌":"出外遇貴發達，小人不足。加羊陀、火鈴、空劫，在外欠安寧。","文曲":"在外近貴，加吉星得財。加羊陀、火鈴，少遂志。","左輔":"動中貴人扶持、發福。加羊陀、火鈴，下人不足、多招是非。","右弼":"出外遇貴人扶持發達，不宜靜守。加羊陀、火鈴、空劫，在外與人有爭競。","祿存":"出外衣祿遂心。會羊陀、火鈴、空劫，與人多不足意。","擎羊":"入廟、在外衣祿遂心。加吉星、鬧中發財。陷地、有成，下人多不足。","陀羅":"會吉星、在外遇貴得財。陷地、加羊、火鈴星、空劫，多招是非、下人不足。","火星":"獨守、出外不安。加吉星、鬧中進財。加羊陀、空劫，招是非、在外少遂志。","鈴星":"有吉星同、在外吉。加羊、火鈴、空劫，不足、招是非。"},"奴僕":{"紫微":"成行得力，旺主生財。加擎羊、火鈴、陀羅，欠力。破軍同、先難後有招。天相同得力。加空劫，招怨逃走。","天機":"入廟、得力，陷空、怨主。天梁同、晚招。太陰同、欠力。","太陽":"入廟旺、主發，陷宮、無分，有也怨主。太陰同、多招。巨門同、有多招怨。加羊陀、火鈴，奴則背主。","武曲":"旺宮不少，一呼百諾。天府同、多奴多婢。破軍同、招怨，末年有招。天相同、得力。七殺同、背主。貪狼同、欠力。","天同":"得力旺相。巨門、先難後易。太陰同、得力。天梁同、助主。加羊陀、火鈴，有背主之奴。","廉貞":"陷地、奴背主，晚年方招得；入廟、一呼百諾。貪狼同、欠力。七殺同、背主。","天府":"得力、一呼百諾。紫微同、助主。武曲同、奴僕有。加陀羊、火鈴、空劫，多背主。","太陰":"廟地得力、成行。太陽同、多奴多婢。天機同、欠力。天同同、旺主。陷地、全無。","貪狼":"初難招敗主之奴，陷地、全無。廉貞同、亦少。","巨門":"入廟、早年不得力，招是非，不能久居。太陽同、助主衛家。天同同、末年招得。","天相":"末年招得。紫微同、多奴多婢。武曲同、怨主。廉貞同、末年可招。","天梁":"奴多旺主。天同同、有衛家之奴。天機同、不一心。","七殺":"欺主，有剛強之僕。武曲同、背主。廉貞、欠力。","破軍":"入廟、得力，陷宮、招怨背主。武曲同、違背。紫微同、得力。廉貞同、欠力。","文昌":"入廟獨守、得力助主。加羊陀、火鈴、空劫，雖有背主。","文曲":"入廟、得力，陷宮、無分。","左輔":"獨守旺相、一呼百諾。加羊陀、火鈴、空劫、耗忌，背主難招。","右弼":"獨守、成行。加羊陀、火鈴、空劫、耗忌，背主。","祿存":"奴僕多。加吉星、衛主起家。見羊陀、火鈴、耗忌，欠力。","擎羊":"背主招怨、不得力，有也不長久；入廟、晚年方可招。","陀羅":"奴僕欠力怨主，入廟加吉星、有分。","火星":"獨守、怨主不得力。加吉星入廟，可招一二。","鈴星":"獨守，不得力、恨主。會吉星入廟，助主衛家。"},"官祿":{"紫微":"廟旺遇左右、昌曲、魁鉞，位至封侯伯。","天機":"入廟權貴，會文曲為良。","太陽":"入廟文武為良，不見羊陀火鈴吉，太陰同貴顯。","武曲":"入廟、與昌曲、左右同宮，武職崢嶸，常人發福。","天同":"入廟文武皆宜。","廉貞":"入廟武職權貴不耐久。","天府":"入廟文武皆吉。","太陰":"入廟、多貴，陷地、氣高橫破難顯達。","貪狼":"入廟、遇火鈴，武職掌大權。","巨門":"入廟、武職權貴，文人不耐久。","天相":"入廟、文武皆宜，食祿千鐘；陷地、成敗。","天梁":"廟午會左右、魁鉞，文武之材。","七殺":"廟旺、武職崢嶸，權貴非小，不宜文人。","破軍":"廟旺、武職軒勝。","文昌":"入廟、太陽同、加吉科權祿，文武之材。","文曲":"廟旺、文武皆宜。","左輔":"入廟、文武之材，武職最旺。","右弼":"宜居武職。","祿存":"會吉、文武皆良，財官雙美。","擎羊":"入廟、最利武職。","陀羅":"獨守、平常。","火星":"晚年功名遂心，早年成敗。","鈴星":"獨守、旺宮，吉。陷地、不美。"},"田宅":{"紫微":"茂盛、自置旺相。加羊陀、火鈴、空劫，有置有去。破軍同、退祖。天相同、有見成家業。","天機":"退祖新創置。天梁同、有置，晚年富。太陰同、自置旺相。","太陽":"入廟、得祖業。太陰同、加吉星，田多。陷地，逢羊陀、火鈴、空劫，全無。","武曲":"單居旺地、得祖父大業，陷地、退後方成。天相同，先見破、後方有。天府同、守見成家業。貪狼同、晚置。","天同":"先少後多，自置甚旺。巨門同、田少。太陰同，入廟、大富。天梁同、先退後進。","廉貞":"破祖。貪狼同、有祖業，不耐久。七殺同、自置。天府同、守見成家業。天相同、先無後有。","天府":"田園茂盛，守祖自置。紫微同，大富。廉貞、武曲同，守祖業、榮昌。","太陰":"入廟、田多。陷地、加忌、及羊陀、火鈴、空劫，田全無。天機同、自創置。天同同、白手自置。","貪狼":"陷宮、退祖，一世田少。紫微同、有祖業。武曲同、晚置。","巨門":"廟旺、橫發置買；陷地、無分，因田產招非。太陽同、先無後有。","天相":"廟旺、有分。紫微同、自置。武曲同、無分。","天梁":"入廟旺、有祖業。天同同、先難後易。","破軍":"在子午宮、守祖業榮昌，但見有進退。紫微同、有見成家業。廉貞同、先破後有置。","文昌":"會諸吉、田園廣置。加羊陀、火鈴、空劫，敗祖。","文曲":"旺地、有分，守祖業，加吉星、自置。","左輔":"有祖業。加羊陀、火鈴、空劫，退祖，田地少；會吉星，多。","祿存":"田園多旺自置。會吉星，承祖業榮昌。","擎羊":"入廟、先破後成。陷地、加空劫，退祖業。","陀羅":"退祖、辛勤度日。加吉星，先無後有。","火星":"獨守，退祖業。會吉星、先無後有。","鈴星":"退祖。入廟、加吉星，自有置。"},"福德":{"紫微":"紫微，福厚、享福安樂。天府、天相同，終身獲吉。破軍同、勞心費力不安。加羊陀、鈴空劫，福薄。","天機":"天機，先勞後逸。巨門同、勞力欠安。天梁同、享福。太陰同、主快樂。加羊陀、火鈴、空劫，奔走不得寧靜。","太陽":"太陽，忙中發福。太陰同、快樂。巨門同、費力欠安。天梁同、快樂。加羊陀、火鈴、空劫、忌耗，終身不美之論。","武曲":"武曲，勞心費力，入廟、安然享福。破軍同、東走西行，不寧靜。天相同、老境安康。七殺同、欠安康。貪狼同、晚年享福   if (cal === 'solar') {
    const d = $('#dateIn').value; if (!d) throw new Error('請填寫出生日期。');
    const [y, m, dd] = d.split('-').map(Number);
    if (y < 1900 || y > 2100) throw new Error('出生年份請在 1900 到 2100 之間。');
    solar = Solar.fromYmdHms(y, m, dd, hh, mm, 0);
  } else {
    const y = +$('#lyIn').value, m = +$('#lmIn').value, d = +$('#ldIn').value, leap = $('#leapIn').checked;
    if (!y || !m || !d) throw new Error('請填寫農曆的年、月、日。');
    if (y < 1900 || y > 2100) throw new Error('出生年份請在 1900 到 2100 之間。');
    let lunar;
    try { lunar = Lunar.fromYmdHms(y, leap ? -m : m, d, hh, mm, 0); } catch (e) { throw new Error(leap ? `農曆${y}年沒有閏${m}月，請取消「閏月」再試一次。` : '這個農曆日期不存在，請確認月份大小（小月只有 29 天）。'); }
    const s = lunar.getSolar();
    solar = Solar.fromYmdHms(s.getYear(), s.getMonth(), s.getDay(), hh, mm, 0);
  }
  return { name: $('#nameIn').value.trim(), gender, cal, time, solar, tIdx: timeIndex(hh) };
}
const pad2 = (n) => String(n).padStart(2, '0');
$('#hourIn').innerHTML = '<option value="">--</option>' + Array.from({ length: 24 }, (_, h) => `<option value="${pad2(h)}">${pad2(h)}</option>`).join('');
$('#minIn').innerHTML = Array.from({ length: 60 }, (_, m) => `<option value="${pad2(m)}">${pad2(m)}</option>`).join('');
function syncTime() { const h = $('#hourIn').value; $('#timeIn').value = h ? `${h}:${$('#minIn').value}` : ''; updateShichen(); }
function setTime(v) { const [h, m] = (v || '').split(':'); $('#hourIn').value = h || ''; $('#minIn').value = m || '00'; syncTime(); }
function updateShichen() {
  const v = $('#timeIn').value; if (!v) { $('#shichen').textContent = ''; return; }
  const i = timeIndex(+v.split(':')[0]);
  $('#shichen').textContent = `${SHICHEN[i]}時（${SHICHEN_RANGE[i]}）`;
}
function syncCal() { const lunar = $('#calL').checked; $('#solarBox').hidden = lunar; $('#lunarBox').hidden = !lunar; $('#dateIn').required = !lunar; }

$('#form').addEventListener('submit', (e) => {
  e.preventDefault();
  const err = $('#err'); err.hidden = true;
  try {
    const input = readForm();
    render(input, false);
    try { localStorage.setItem('fortune.last', JSON.stringify({ name: input.name, gender: input.gender, cal: input.cal, date: $('#dateIn').value, ly: $('#lyIn').value, lm: $('#lmIn').value, ld: $('#ldIn').value, leap: $('#leapIn').checked, time: input.time })); } catch (x) {}
    $('#result').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  } catch (x) { err.textContent = x.message || '排盤失敗，請檢查輸入。'; err.hidden = false; }
});
document.querySelectorAll('input[name=cal]').forEach((r) => r.addEventListener('change', syncCal));
['#hourIn', '#minIn'].forEach((id) => $(id).addEventListener('change', syncTime));

function boot() {
  if (typeof Solar === 'undefined' || typeof iztro === 'undefined') {
    $('#result').innerHTML = '<p class="err">排盤函式庫載入失敗，請重新整理頁面。</p>'; return;
  }
  let last = null; try { last = JSON.parse(localStorage.getItem('fortune.last') || 'null'); } catch (e) {}
  if (last) {
    $('#nameIn').value = last.name || ''; (last.gender === '女' ? $('#gF') : $('#gM')).checked = true;
    (last.cal === 'lunar' ? $('#calL') : $('#calS')).checked = true;
    $('#dateIn').value = last.date || ''; $('#lyIn').value = last.ly || ''; $('#lmIn').value = last.lm || ''; $('#ldIn').value = last.ld || '';
    $('#leapIn').checked = !!last.leap; setTime(last.time);
    syncCal(); updateShichen();
    try { render(readForm(), false); return; } catch (e) {}
  }
  // sample chart so the page opens in a working state
  $('#dateIn').value = '1990-05-15'; setTime('14:30'); syncCal(); updateShichen();
  render(readForm(), true);
}
boot();
})();
</script>
</body>
